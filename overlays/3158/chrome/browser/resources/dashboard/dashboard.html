<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulachrome Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="components/simulachrome.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="settings_styles.css">

</head>
<body>

    <div class="dashboard-container">
        <!-- Main Tab Navigation -->
        <nav class="dashboard-nav">
            <div class="nav-tabs">
                <button id="nav-dashboard-btn" class="nav-tab active">
                    <img id="directory-bg" class="icon" src="components/directory0.svg" alt="Dashboard">
                    <span>Dashboard</span>
                </button>
                <script>
                    // 1. Generate a random integer between 0 and 8 (inclusive)
                    // Math.random() gives a float between 0 (inclusive) and 1 (exclusive)
                    // Math.floor(Math.random() * 9) gives an integer between 0 and 8
                    const randomNumber = Math.floor(Math.random() * 9);

                    // 2. Build the new image source string
                    // e.g., "components/dashboard4.png"
                    const newSrc = `components/directory${randomNumber}.svg`;

                    // 3. Find the image element using its ID
                    const imageElement = document.getElementById('directory-bg');

                    // 4. Update the src attribute
                    if (imageElement) {
                        imageElement.src = newSrc;
                    }
                </script>
                <button id="nav-debugging-btn" class="nav-tab">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    <span>Debugging</span>
                </button>
                <button id="nav-data-btn" class="nav-tab">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
                    <span>Data</span>
                </button>
                <button id="nav-settings-btn" class="nav-tab">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span>Settings</span>
                </button>
            </div>
        </nav>

        <main class="dashboard-content">
            <!-- DASHBOARD VIEW -->
            <div id="dashboard-main-view" class="view active">
                <div class="left-sidebar">
                        <div class="panel">
                        <div class="panel-header">Scripts</div>
                        <div class="sidebar-actions">
                            <button id="create-new-script-btn" class="btn">New Script</button>
                            <button id="export-script-btn" class="btn">Export</button>
                            <button id="delete-script-btn-dash" class="btn btn-danger">Delete</button>
                        </div>
                        <div id="script-list" class="script-list"></div>
                    </div>
                </div>

                <div class="main-panel">
                    <div class="timeline-header-container">
                        <h2 id="timeline-header" class="panel-header"></h2>
                        <div style="display:flex; gap:8px; align-items:center;">
                          <button id="capture-locators-btn" class="btn">Capture Locators</button>
                          <button id="script-settings-btn" class="btn">Settings</button>
                        </div>
                    </div>
                    <div id="timeline" class="timeline-container"></div>
                </div>

                <div id="timeline-sidebar" class="right-sidebar">
                    <div id="action-menu" class="action-menu panel"></div>
                    <div id="traffic-panel" class="panel traffic-panel">
                        <div class="panel-header traffic-panel-header">
                            <span>Traffic</span>
                            <button id="traffic-refresh-btn" class="btn btn-small" type="button">Refresh</button>
                        </div>
                        <div id="traffic-list" class="traffic-list"></div>
                    </div>
                </div>
            </div>

            <!-- DATA VIEW -->
            <div id="dashboard-data-view" class="view"></div>

            <!-- DEBUGGING VIEW -->
            <div id="dashboard-debugging-view" class="view"></div>

            <!-- SETTINGS VIEW -->
            <div id="dashboard-settings-view" class="view"></div>
        </main>

        <aside id="global-agent-console-shell" aria-label="Action Editor" hidden>
            <div id="action-editor" class="action-editor panel hidden"></div>
        </aside>
    </div>

    <!-- MODALS -->
    <div id="input-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="input-modal-title" class="modal-header">Enter Name</h3>
            <input type="text" id="script-name-input" class="input-field">
            <div class="modal-actions">
                <button id="cancel-input" class="btn">Cancel</button>
                <button id="confirm-input" class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>
    <div id="confirmation-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="modal-header">Are you sure?</h3>
            <p id="confirmation-text" class="my-4"></p>
            <div class="modal-actions">
                <button id="cancel-confirm" class="btn">Cancel</button>
                <button id="confirm-action" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>
    <div id="script-settings-modal" class="modal-overlay hidden"></div>

    <script type="module" src="dashboard_app.js"></script>
</body>
</html>
